<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitrix24 × МойСклад — Сравнение</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <section class="comparison">
        <div class="comparison__header">
          <p class="comparison__eyebrow">Сравнение возможностей</p>
          <h1 class="comparison__title">МойСклад и Битрикс24</h1>
          <p class="comparison__subtitle">
            Лаконичная таблица, которая подчёркивает сильные стороны сервисов.
          </p>
        </div>

        <div class="comparison__table" role="table" aria-label="Сравнение функциональности">
          <div class="comparison__row comparison__row--head" role="row">
            <div class="comparison__cell comparison__cell--feature" role="columnheader">
              Возможности
            </div>
            <div class="comparison__cell" role="columnheader">МойСклад</div>
            <div class="comparison__cell" role="columnheader">Битрикс24</div>
          </div>

          <div class="comparison__row" role="row">
            <div class="comparison__cell comparison__cell--feature" role="rowheader">
              Учёт товаров
            </div>
            <div class="comparison__cell">
              <span class="status status--yes" aria-label="Есть"></span>
            </div>
            <div class="comparison__cell">
              <span class="status status--no" aria-label="Нет"></span>
            </div>
          </div>

          <div class="comparison__row" role="row">
            <div class="comparison__cell comparison__cell--feature" role="rowheader">Склад</div>
            <div class="comparison__cell">
              <span class="status status--yes" aria-label="Есть"></span>
            </div>
            <div class="comparison__cell">
              <span class="status status--no" aria-label="Нет"></span>
            </div>
          </div>

          <div class="comparison__row" role="row">
            <div class="comparison__cell comparison__cell--feature" role="rowheader">
              CRM и сделки
            </div>
            <div class="comparison__cell">
              <span class="status status--no" aria-label="Нет"></span>
            </div>
            <div class="comparison__cell">
              <span class="status status--yes" aria-label="Есть"></span>
            </div>
          </div>

          <div class="comparison__row" role="row">
            <div class="comparison__cell comparison__cell--feature" role="rowheader">
              Задачи и контроль
            </div>
            <div class="comparison__cell">
              <span class="status status--no" aria-label="Нет"></span>
            </div>
            <div class="comparison__cell">
              <span class="status status--yes" aria-label="Есть"></span>
            </div>
          </div>

          <div class="comparison__row" role="row">
            <div class="comparison__cell comparison__cell--feature" role="rowheader">
              Автоматизация
            </div>
            <div class="comparison__cell">
              <span class="status status--no" aria-label="Нет"></span>
            </div>
            <div class="comparison__cell">
              <span class="status status--yes" aria-label="Есть"></span>
            </div>
          </div>

          <div class="comparison__row" role="row">
            <div class="comparison__cell comparison__cell--feature" role="rowheader">
              Командная работа
            </div>
            <div class="comparison__cell">
              <span class="status status--no" aria-label="Нет"></span>
            </div>
            <div class="comparison__cell">
              <span class="status status--yes" aria-label="Есть"></span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
